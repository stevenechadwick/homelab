apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: home-assistant
  namespace: monitoring
  labels:
    app: home-assistant
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: home-assistant
  endpoints:
  - port: http
    interval: 30s
    path: /api/prometheus
    scheme: http
    bearerTokenSecret:
      name: home-assistant-token
      key: token
  namespaceSelector:
    matchNames:
    - home
