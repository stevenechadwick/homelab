# Authelia middleware for Gitea namespace
# Pattern: Each namespace that needs Authelia authentication should have its own middleware
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: gitea
spec:
  forwardAuth:
    address: http://authelia-simple.authelia.svc.cluster.local/api/verify?rd=https://auth.homelab.local
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
