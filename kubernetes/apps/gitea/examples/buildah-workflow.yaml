# Example Gitea Actions workflow using Buildah for container image builds
# Save this as .gitea/workflows/build.yaml in your repository
#
# Buildah is a daemonless container image builder that replaces Kaniko.
# It uses chroot isolation and doesn't require privileged containers.
#
# Note: This workflow uses shell commands for checkout to avoid JavaScript
# action dependencies. For production use, ensure your runner has proper
# network access to clone repositories.

name: Build and Push Container Image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: gitea.homelab.local
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        run: |
          git clone $GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git .
          git checkout $GITHUB_SHA
          echo "Checked out $GITHUB_SHA"

      - name: Install Buildah
        run: |
          . /etc/os-release
          sudo sh -c "echo 'deb http://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_${VERSION_ID}/ /' > /etc/apt/sources.list.d/devel:kubic:libcontainers:stable.list"
          curl -fsSL "https://download.opensuse.org/repositories/devel:kubic:libcontainers:stable/xUbuntu_${VERSION_ID}/Release.key" | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -qq -y buildah

      - name: Build Container Image
        run: |
          buildah build \
            --isolation chroot \
            --format docker \
            --layers \
            --tag $REGISTRY/$IMAGE_NAME:$GITHUB_SHA \
            --tag $REGISTRY/$IMAGE_NAME:latest \
            .

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            buildah login --username ${{ gitea.actor }} --password-stdin $REGISTRY

      - name: Push to Registry
        if: github.event_name == 'push'
        run: |
          buildah push $REGISTRY/$IMAGE_NAME:$GITHUB_SHA
          buildah push $REGISTRY/$IMAGE_NAME:latest

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: $REGISTRY/$IMAGE_NAME:$GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          buildah images
