apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  entryPoints:
  - web
  - websecure
  routes:
  # Container registry API - bypass Authelia (Docker handles its own auth)
  - match: Host(`gitea.homelab.local`) && PathPrefix(`/v2`)
    kind: Rule
    services:
    - name: gitea
      port: 80
  # All other paths - require Authelia authentication
  - match: Host(`gitea.homelab.local`)
    kind: Rule
    middlewares:
    - name: authelia
    services:
    - name: gitea
      port: 80
  tls:
    secretName: gitea-homelab-tls
