apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: init-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          # Fix permissions on data volume
          chown -R 1000:1000 /var/lib/gitea
          chmod -R 755 /var/lib/gitea
          # Copy config to writable directory and set permissions
          mkdir -p /etc/gitea
          cp /etc/gitea-source/app.ini /etc/gitea/app.ini
          chown -R 1000:1000 /etc/gitea
          chmod 644 /etc/gitea/app.ini
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /var/lib/gitea
        - name: config-source
          mountPath: /etc/gitea-source
        - name: config
          mountPath: /etc/gitea
      containers:
      - name: gitea
        image: gitea/gitea:1.22-rootless
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        ports:
        - name: http
          containerPort: 3000
        - name: ssh
          containerPort: 22
        env:
        - name: TZ
          value: "America/New_York"
        - name: GITEA__security__INSTALL_LOCK
          value: "true"
        - name: GITEA__security__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: gitea-internal-token
              key: INTERNAL_TOKEN
        - name: GITEA_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: gitea-admin-credentials
              key: GITEA_ADMIN_USERNAME
        - name: GITEA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitea-admin-credentials
              key: GITEA_ADMIN_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/gitea
        - name: config
          mountPath: /etc/gitea
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gitea-data
      - name: config-source
        configMap:
          name: gitea-config
      - name: config
        emptyDir: {}
