# Gitea Actions Runner with Docker-in-Docker (dind) sidecar
# DinD provides container runtime for workflow job execution
# Use Buildah (not Docker) inside workflows for building container images
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: gitea
  labels:
    app: gitea-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      containers:
      # Runner container - executes CI/CD jobs
      - name: runner
        image: gitea/act_runner:0.2.13
        command:
        - sh
        - -c
        - |
          # Wait for Docker daemon to be ready (non-TLS port)
          while ! nc -z localhost 2375; do
            echo "Waiting for Docker daemon..."
            sleep 2
          done
          echo "Docker daemon is ready"
          # Copy config to data dir
          cp /etc/act_runner/config.yaml /data/config.yaml
          cd /data
          # Register if not already registered
          if [ ! -f /data/.runner ]; then
            echo "Registering runner..."
            act_runner register --no-interactive \
              --instance "$GITEA_INSTANCE_URL" \
              --token "$GITEA_RUNNER_REGISTRATION_TOKEN" \
              --name "$GITEA_RUNNER_NAME" \
              --labels "$GITEA_RUNNER_LABELS" \
              --config /data/config.yaml
          fi
          # Start the runner with config
          act_runner daemon --config /data/config.yaml
        env:
        - name: CONFIG_FILE
          value: /data/config.yaml
        - name: TZ
          value: "America/New_York"
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        - name: GITEA_INSTANCE_URL
          value: "http://gitea.gitea.svc.cluster.local:80"
        - name: GITEA_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-runner-token
              key: token
        - name: GITEA_RUNNER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GITEA_RUNNER_LABELS
          value: "ubuntu-latest:docker://catthehacker/ubuntu:act-22.04,ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04"
        volumeMounts:
        - name: runner-data
          mountPath: /data
        - name: cache
          mountPath: /root/.cache
        - name: runner-config
          mountPath: /etc/act_runner
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "test -f /data/.runner"
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "test -f /data/.runner"
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      # Docker-in-Docker sidecar - provides Docker daemon for building images
      # TLS disabled for pod-internal communication (localhost only)
      # Registry CA mounted for secure pushes to gitea.homelab.local
      # Insecure registry for internal HTTP access to gitea.gitea.svc.cluster.local
      - name: dind
        image: docker:27-dind
        args:
          - "--insecure-registry=gitea.gitea.svc.cluster.local"
        securityContext:
          privileged: true
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        volumeMounts:
        - name: dind-storage
          mountPath: /var/lib/docker
        - name: registry-ca
          mountPath: /etc/docker/certs.d/gitea.homelab.local
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

      volumes:
      - name: runner-data
        emptyDir:
          sizeLimit: 10Gi
      - name: dind-storage
        emptyDir:
          sizeLimit: 20Gi
      - name: cache
        persistentVolumeClaim:
          claimName: gitea-runner-cache
      - name: runner-config
        configMap:
          name: gitea-runner-config
      - name: registry-ca
        configMap:
          name: homelab-ca
