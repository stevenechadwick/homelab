apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    theme: dark
    
    server:
      host: 0.0.0.0
      port: 9091
      
    log:
      level: info
      format: text
      
    totp:
      issuer: homelab.local
      period: 30
      skew: 1
      
    authentication_backend:
      file:
        path: /config/users_database.yml
        password:
          algorithm: argon2id
          iterations: 3
          key_length: 32
          salt_length: 16
          parallelism: 4
          memory: 128
          
    access_control:
      default_policy: deny
      rules:
        # Allow homepage without auth
        - domain: homepage.homelab.local
          policy: bypass
          
        # Public access to certain paths
        - domain: "*.homelab.local"
          policy: bypass
          resources:
            - "^/api/.*"
            - "^/metrics.*"
            
        # Require auth for all other services
        - domain: "*.homelab.local"
          policy: one_factor
          
    session:
      name: authelia_session
      same_site: lax
      expiration: 1h
      inactivity: 5m
      remember_me_duration: 1M
      cookies:
        - domain: homelab.local
          authelia_url: https://auth.homelab.local
          default_redirection_url: https://homepage.homelab.local
      
    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m
      
    storage:
      local:
        path: /config/db.sqlite3
        
    notifier:
      filesystem:
        filename: /config/notification.txt