apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`auth.homelab.local`)
    kind: Rule
    services:
    - name: authelia
      port: 80
  tls:
    secretName: authelia-homelab-tls